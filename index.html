<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Métro Français</title>
<meta name="theme-color" content="#2F6BFF">
<meta name="description" content="Learn French step by step: listen, speak and play.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Français">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one phone-width column app; a winding path of round stations grouped into colourful units, bottom tab bar, full-screen lessons. */
:root{
  --bg:#EDF4FF; --surface:#FFFFFF; --soft:#F5F8FF; --ink:#1B2340; --muted:#5B6687; --line:#D6E1F2;
  --primary:#2F6BFF; --primary-ink:#FFFFFF; --primary-deep:#1D4FD6;
  --red:#F0475A; --sun:#FFB800; --good:#14A862; --good-bg:#DDF6E8; --bad:#E5384C; --bad-bg:#FDE4E7; --warn:#E08600;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1430; --surface:#18214A; --soft:#1F2A58; --ink:#EEF2FF; --muted:#A2ACD3; --line:#2C3870;
  --primary:#5B8CFF; --primary-ink:#081133; --primary-deep:#3A6BE6;
  --red:#FF6B7B; --sun:#FFC83D; --good:#38D28A; --good-bg:#11372A; --bad:#FF6B7B; --bad-bg:#3D1A24; --warn:#FFB44D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1430; --surface:#18214A; --soft:#1F2A58; --ink:#EEF2FF; --muted:#A2ACD3; --line:#2C3870;
  --primary:#5B8CFF; --primary-ink:#081133; --primary-deep:#3A6BE6;
  --red:#FF6B7B; --sun:#FFC83D; --good:#38D28A; --good-bg:#11372A; --bad:#FF6B7B; --bad-bg:#3D1A24; --warn:#FFB44D; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
html.kid body{font-size:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 110px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.who{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;min-width:0}
.ava{width:42px;height:42px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-size:1.4rem;flex:none}
.who b{font-family:var(--display);font-weight:600;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;flex:none}
.chip{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums;padding:5px 11px;border-radius:999px;background:var(--surface);border:2px solid var(--line)}
.chip.fire{color:#F26B1D}.chip.fire.off{color:var(--muted)}
.chip.xp{color:var(--sun)}
/* hero */
.hero{background:linear-gradient(160deg,var(--primary),var(--primary-deep));color:#fff;border-radius:26px;padding:18px;display:grid;grid-template-columns:96px 1fr;gap:6px 14px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .mascot{width:96px;height:auto;grid-row:span 2}
.bubble{background:#fff;color:#1B2340;border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:700;position:relative;z-index:1}
.bubble small{display:block;font-weight:600;color:#5B6687;font-size:.85em}
.hero-goal{display:flex;align-items:center;gap:10px;z-index:1}
.ring{width:54px;height:54px;flex:none}
.hero-goal span{font-size:.92rem;line-height:1.3}
.hero .btn{grid-column:1/-1;margin-top:8px;background:#fff;color:var(--primary-deep);box-shadow:0 5px 0 rgba(0,0,0,.18);z-index:1}
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:1.05rem;background:var(--primary);color:var(--primary-ink);box-shadow:0 5px 0 var(--primary-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--primary-deep)}
.btn[disabled]{background:var(--line);color:var(--muted);box-shadow:none;cursor:default;transform:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.wide{width:100%}
.note{font-size:.92rem;color:var(--muted);background:var(--surface);border:2px dashed var(--line);border-radius:16px;padding:12px 14px}
.note b{color:var(--ink)}
.note.cta{border-style:solid;border-color:var(--primary);display:flex;flex-direction:column;gap:10px}
/* map */
.unit{display:flex;flex-direction:column;gap:6px}
.unit-head{display:flex;align-items:center;gap:12px;background:var(--c);color:#fff;border-radius:20px;padding:12px 14px;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 65%,#000)}
.u-pic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:1.7rem;flex:none}
.u-txt{flex:1;min-width:0}
.u-k{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;opacity:.9}
.u-t{font-family:var(--display);font-weight:600;font-size:1.3rem;line-height:1.1}
.u-w{font-size:.88rem;opacity:.92}
.u-prog{font-weight:800;background:rgba(255,255,255,.22);border-radius:99px;padding:3px 10px;font-variant-numeric:tabular-nums;flex:none}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:18px 10px}
.st{position:relative;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(var(--x))}
.st .circ{width:76px;height:76px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.6rem;box-shadow:0 6px 0 color-mix(in srgb,var(--c) 60%,#000);transition:transform .1s}
.st:active .circ{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 60%,#000)}
.st.locked .circ{background:var(--line);color:var(--muted);box-shadow:0 6px 0 color-mix(in srgb,var(--line) 70%,#000)}
.st.cur .circ{outline:5px solid color-mix(in srgb,var(--c) 30%,transparent);outline-offset:4px;animation:bob 2s ease-in-out infinite}
.st .lbl{font-weight:800;font-size:.85rem;color:var(--muted)}
.st .stars{font-size:.85rem;color:var(--sun);letter-spacing:1px;line-height:1}
.st .go{position:absolute;top:-34px;background:var(--surface);color:var(--c);border:2px solid var(--line);font-weight:800;padding:2px 12px;border-radius:12px;font-size:.85rem;white-space:nowrap}
.st.shake{animation:shake .35s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shake{0%,100%{transform:translateX(var(--x))}25%{transform:translateX(calc(var(--x) - 8px))}75%{transform:translateX(calc(var(--x) + 8px))}}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:5}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{background:none;border:0;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:800;color:var(--muted)}
.nav button.on{color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent)}
/* sections */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-size:1.35rem}
.sec-h span{color:var(--muted);font-size:.9rem}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pcard{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 var(--line);min-width:0}
.pcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pcard[disabled]{opacity:.5;cursor:default}
.pcard .pi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;background:var(--soft)}
.pcard b{font-family:var(--display);font-weight:600;font-size:1.1rem;line-height:1.2}
.pcard small{color:var(--muted);line-height:1.3}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile-s{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.tile-s b{display:block;font-family:var(--display);font-weight:600;font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.tile-s small{color:var(--muted);font-weight:700}
.cal{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-g .dn{text-align:center;font-size:.75rem;font-weight:800;color:var(--muted)}
.cal-g .d{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.cal-g .d.l1{background:color-mix(in srgb,var(--good) 30%,var(--soft));color:var(--ink)}
.cal-g .d.l2{background:color-mix(in srgb,var(--good) 60%,var(--soft));color:#fff}
.cal-g .d.l3{background:var(--good);color:#fff}
.cal-g .d.today{outline:2px solid var(--primary);outline-offset:1px}
.cal-g .d.fut{opacity:.35}
.legend{display:flex;gap:6px;align-items:center;font-size:.78rem;color:var(--muted);justify-content:flex-end}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.stamps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stamp{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.stamp .sm{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;border:3px dashed var(--red);color:var(--red);transform:rotate(-8deg);background:color-mix(in srgb,var(--red) 8%,var(--surface))}
.stamp.off{opacity:.45}.stamp.off .sm{border-color:var(--line);color:var(--muted);background:var(--soft)}
.stamp b{font-size:.85rem;line-height:1.2}.stamp small{font-size:.72rem;color:var(--muted);line-height:1.2}
.words{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:40px 1fr auto auto;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.wrow .wp{font-size:1.4rem;text-align:center}
.wrow .wt{min-width:0}.wrow .wt b{display:block;line-height:1.2}.wrow .wt small{color:var(--muted)}
.score-pill{font-weight:800;font-size:.8rem;border-radius:99px;padding:2px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sp-g{background:var(--good-bg);color:var(--good)}.sp-o{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}.sp-r{background:var(--bad-bg);color:var(--bad)}.sp-n{background:var(--soft);color:var(--muted)}
.iconbtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center}
details summary{cursor:pointer;font-weight:800;color:var(--primary);padding:6px 0}
/* profiles + settings */
.plist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pbtn{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pbtn.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--surface))}
.pbtn .ava{width:54px;height:54px;font-size:1.8rem}
.pbtn b{font-size:.9rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn small{color:var(--muted);font-size:.75rem}
.form{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px}
.form label{font-weight:800;display:flex;flex-direction:column;gap:6px}
.form input[type=text],.form textarea{font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--soft);color:var(--ink);width:100%}
.form textarea{min-height:90px;font-size:.8rem;font-family:ui-monospace,Menlo,monospace}
.avas{display:flex;flex-wrap:wrap;gap:8px}
.avas button{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--soft);font-size:1.5rem}
.avas button.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 15%,var(--surface))}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:2px solid var(--line);background:var(--soft);border-radius:12px;padding:8px 10px;font-weight:800}
.seg button.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 15%,var(--surface));color:var(--primary)}
.switch{display:flex!important;flex-direction:row!important;align-items:center;justify-content:space-between;gap:12px}
.switch span small{display:block;font-weight:600;color:var(--muted)}
.tog{width:56px;height:32px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--good)}.tog.on::after{left:28px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.9rem;padding:4px}
.danger{color:var(--bad)}
/* lesson */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column}
.l-head{display:flex;align-items:center;gap:12px;max-width:560px;width:100%;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 6px}
.x{background:none;border:0;font-size:1.8rem;line-height:1;color:var(--muted);padding:4px 6px}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .4s}
.l-head .bar{flex:1;height:16px}
.l-head .bar>i{background:linear-gradient(90deg,var(--good),color-mix(in srgb,var(--good) 70%,#fff))}
.hearts{display:flex;align-items:center;gap:4px;color:var(--red);font-weight:800;font-variant-numeric:tabular-nums}
.l-body{flex:1;overflow-y:auto;max-width:560px;width:100%;margin:0 auto;padding:10px 16px 24px;display:flex;flex-direction:column;gap:16px}
.kind{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--primary)}
.prompt{font-family:var(--display);font-size:1.5rem;font-weight:600}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.pic{font-size:4.2rem;line-height:1.1}
.pic.txt{font-family:var(--display);font-weight:700;font-size:3rem;color:var(--primary);background:var(--soft);border-radius:20px;padding:4px 18px}
.fr{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1.15}
html.kid .fr{font-size:2.3rem}
.pron{color:var(--muted);font-weight:700;letter-spacing:.02em}
.en{font-size:1.1rem}
.audio{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.play{display:flex;align-items:center;gap:8px;border:0;border-radius:16px;padding:12px 16px;font-weight:800;background:var(--primary);color:var(--primary-ink);box-shadow:0 4px 0 var(--primary-deep)}
.play.big{padding:24px 30px;border-radius:24px}
.play.slow{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opts.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-size:1.08rem;font-weight:700;box-shadow:0 4px 0 var(--line);display:flex;align-items:center;gap:12px;min-width:0}
.opt .op{font-size:1.8rem;flex:none}
.opts.grid2 .opt{flex-direction:column;text-align:center;justify-content:center}
.opts.grid2 .opt .op{font-size:2.6rem}
.opt.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--surface));box-shadow:0 4px 0 var(--primary)}
.slot{min-height:66px;border-bottom:3px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-bottom:10px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:9px 14px;font-size:1.08rem;font-weight:700;box-shadow:0 3px 0 var(--line)}
.tile.used{visibility:hidden}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.mt{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 10px;font-weight:800;box-shadow:0 4px 0 var(--line);min-height:60px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.mt .op{font-size:1.6rem}
.mt.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--surface))}
.mt.solved{opacity:.25;box-shadow:none;border-style:dashed}
.mt.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake0 .3s}
@keyframes shake0{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* speaking */
.speak{display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px 16px}
.mic{width:92px;height:92px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 color-mix(in srgb,var(--red) 60%,#000)}
.mic.small{width:64px;height:64px}
.mic.on{animation:micpulse 1.2s infinite}
@keyframes micpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 55%,transparent)}70%{box-shadow:0 0 0 22px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sk-t{font-weight:800;text-align:center}
.sk-s{color:var(--muted);font-size:.92rem;text-align:center;max-width:36ch}
.result{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.res-top{display:flex;align-items:center;gap:14px}
.res-top .ring{width:76px;height:76px}
.res-top b{font-family:var(--display);font-size:1.5rem;font-weight:600;display:block;line-height:1.1}
.res-top .stars{color:var(--sun);font-size:1.3rem;letter-spacing:2px}
.wchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.wc{border-radius:10px;padding:4px 10px;font-weight:800;font-size:1rem}
.wc.g{background:var(--good-bg);color:var(--good)}.wc.o{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}.wc.r{background:var(--bad-bg);color:var(--bad);text-decoration:underline wavy}
.heard{font-size:.92rem;color:var(--muted);text-align:center}
.heard q{color:var(--ink);font-weight:700}
.tips{width:100%;display:flex;flex-direction:column;gap:8px}
.tip{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:.93rem;text-align:left}
.tip b{color:var(--primary)}
.sk-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.l-foot{border-top:2px solid var(--line);background:var(--bg);padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
.l-foot-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.l-foot.ok{background:var(--good-bg);border-color:transparent}

const DIG={"0":"zero","1":"un","2":"deux","3":"trois","4":"quatre","5":"cinq","6":"six","7":"sept","8":"huit","9":"neuf","10":"dix"};
const strip=w=>w.toLowerCase().replace(/œ/g,"oe").normalize("NFD").replace(/[̀-ͯ]/g,"");

const TIPS=[

function tipsFor(chips){const out=[];chips.filter(c=>c.s!=="g").forEach(c=>{const w=c.w.toLowerCase();

function distractors(item,pool,n){let c=shuffle(pool.filter(x=>x!==item&&x.en!==item.en&&x.pic!==item.pic));
 if(c.length<n)c=c.concat(shuffle(ALL.filter(x=>x!==item&&x.en!==item.en&&x.pic!==item.pic&&!c.includes(x))));return c.slice(0,n)}
function mk(type,item,pool){
 if(type==="listen"||type==="picture"||type==="en")return{type,item,opts:shuffle([item,...distractors(item,pool,3)])};
 if(type==="build"||type==="lbuild"){const ws=bare(T(item)).split(" ");
  const extra=shuffle([...new Set(pool.filter(x=>x!==item).flatMap(x=>bare(T(x)).split(" ")))].filter(w=>!ws.some(v=>v.toLowerCase()===w.toLowerCase()))).slice(0,2);
  return{type,item,words:ws,bank:shuffle([...ws,...extra])}}
 if(type==="match"){const its=shuffle(pool).slice(0,4);return{type,item:its[0],its,L:shuffle(its),Rr:shuffle(its)}}
 return{type,item}}
function quiz(it,i,pool){const t=["listen","picture","en"][i%3];return mk(t,it,pool)}
function buildQueue(L){
 const g=[];let learn=[];
 if(L.l<2){learn=L.items.map(it=>({type:"learn",item:it}));
  L.items.forEach((it,i)=>{g.push(quiz(it,i,L.pool));if(wc(it)>=3)g.push(mk(i%2?"build":"lbuild",it,L.pool))});
  if(L.pool.length>=4)g.push(mk("match",null,L.pool));
  shuffle(L.items).slice(0,2).forEach(it=>g.push(mk("speak",it)))}
 else{L.pool.forEach((it,i)=>g.push(quiz(it,i+1,L.pool)));
  shuffle(L.pool.filter(x=>wc(x)>=3)).slice(0,2).forEach(it=>g.push(mk("lbuild",it,L.pool)));
  g.push(mk("match",null,L.pool));
  shuffle(L.pool).slice(0,3).forEach(it=>g.push(mk("speak",it)))}
 return[...learn,...shuffle(g)]}
function practicePool(p,mode){let pool=learned(p);if(!pool.length)pool=UNITS[0].items.slice(0,4);
 if(mode==="weak"){const w=pool.filter(x=>(p.weak[x.k]||0)>0).sort((a,b)=>(p.weak[b.k]||0)-(p.weak[a.k]||0));return w.length?w:pool}
 return pool.slice().sort((a,b)=>(p.weak[b.k]||0)-(p.weak[a.k]||0)+(Math.random()-.5)*2)}
function practiceQueue(mode){const p=P(),pool=practicePool(p,mode),pick=shuffle(pool.slice(0,14)).slice(0,mode==="speak"?8:10);
 if(mode==="speak")return pick.map(it=>mk("speak",it));
 if(mode==="listen")return pick.map((it,i)=>wc(it)>=3&&i%2?mk("lbuild",it,pool):mk("listen",it,pool));
 const q=pick.map((it,i)=>i%4===3?mk("speak",it):wc(it)>=3&&i%3===0?mk("lbuild",it,pool):quiz(it,i,pool));
 if(pool.length>=4)q.splice(3,0,mk("match",null,pool));return q}

   ${gated&&!R.fb?`<button class="btn" data-act="selfok">I said it out loud</button>`:""}</div>`}
 if(s.state==="listening")return`<div class="speak"><button class="mic on" data-act="stopmic" aria-label="Stop">${I.stop()}</button><div class="sk-t">Listening… speak now</div><div class="sk-s">Tap to stop</div></div>`;
 if(s.state==="result"){const r=s.res,v=verdict(r.score),tips=tipsFor(r.chips);
  const col=r.score>=85?"var(--good)":r.score>=60?"var(--warn)":"var(--bad)";
  return`<div class="speak"><div class="result">
   <div class="res-top" style="color:${col}">${ring(r.score/100,76,col,r.score+"%")}<div><b>${v.label}</b><span class="stars">${stars(v.stars)}</span></div></div>
   ${r.chips.length?`<div class="wchips">${r.chips.map(c=>`<span class="wc ${c.s}">${esc(c.w)}</span>`).join("")}</div>`:""}
   <div class="heard">I heard: <q>${esc(r.heard)}</q></div>
   ${tips.length?`<div class="tips">${tips.map(t=>`<div class="tip">${t.w?`<b>${esc(t.w)}</b> · `:""}${t.t}</div>`).join("")}</div>`:""}
   <div class="sk-row"><button class="mini" data-act="slow">🐢 Hear it slowly</button><button class="mini" data-act="mic" style="background:var(--red);color:#fff">${I.mic(16)} Try again</button></div></div></div>`}
 return`<div class="speak"><button class="mic ${gated?"":"small"}" data-act="mic" aria-label="Record">${I.mic(gated?40:28)}</button>
  <div class="sk-t">${gated?"Tap the mic and say it":"Try saying it"}</div>
  ${s.err?`<div class="sk-s" style="color:var(--bad)">${esc(s.err)}</div>`:`<div class="sk-s">${gated?"Listen first, then speak clearly. I'll check your pronunciation.":"Optional: get a quick pronunciation check."}</div>`}
  ${gated&&s.tries>=2&&!R.fb?`<button class="linkbtn" data-act="skipspeak">Skip for now</button>`:""}</div>`}
function renderLesson(){
 const ex=cur(),total=R.done+R.queue.length,pc=R.done/total*100,it=ex.item;
 const head=`<div class="l-head"><button class="x" data-act="quit" aria-label="Quit lesson">×</button><div class="bar"><i style="width:${pc}%"></i></div>${R.hearts===Infinity?"":`<span class="hearts" title="Hearts">${I.heart}${R.hearts}</span>`}</div>`;
 let body="",foot="";
 if(ex.type==="learn"){
  body=`<div class="kind">New ${wc(it)>2?"phrase":"word"}</div><div class="card">${picHTML(it.pic)}<div class="fr">${esc(T(it))}</div><div class="pron">${esc(it.pron)}</div><div class="en">${esc(TE(it))}</div>${audioBtns()}</div>${speakBlock(false)}`;
  foot=`<button class="btn wide" data-act="next">Got it</button>`}
 else if(ex.type==="listen"||ex.type==="picture"||ex.type==="en"){
  const grid=ex.type!=="en";
  if(ex.type==="listen")body=`<div class="kind">Listening</div><div class="prompt">What did you hear?</div><div class="audio"><button class="play big" data-act="play">${I.spk(34)}</button><button class="play slow" data-act="slow">🐢 Slow</button></div>`;
  else if(ex.type==="picture")body=`<div class="kind">Picture</div><div class="prompt">What is this in French?</div><div class="card">${picHTML(it.pic)}</div>`;
  else body=`<div class="kind">Translate</div><div class="prompt">How do you say “${esc(TE(it))}”?</div>`;
  body+=`<div class="opts ${grid?"grid2":""}">${ex.opts.map((o,i)=>`<button class="opt ${R.sel===i?"sel":""}" data-act="sel" data-i="${i}" ${R.fb?"disabled":""}>${ex.type==="listen"?`${picHTML(o.pic,"op")}<span>${esc(TE(o))}</span>`:`<span>${esc(T(o))}</span>`}</button>`).join("")}</div>`;
  foot=`<button class="btn wide" data-act="check" ${R.sel==null?"disabled":""}>Check</button>`}
 else if(ex.type==="build"||ex.type==="lbuild"){
  body=ex.type==="build"?`<div class="kind">Build the sentence</div><div class="prompt">${it.pic&&!isTxtPic(it.pic)?it.pic+" ":""}“${esc(TE(it))}”</div>`
   :`<div class="kind">Listen & build</div><div class="prompt">Tap the words you hear</div><div class="audio"><button class="play big" data-act="play">${I.spk(34)}</button><button class="play slow" data-act="slow">🐢 Slow</button></div>`;
  body+=`<div class="slot">${R.built.map((bi,k)=>`<button class="tile" data-act="unpick" data-k="${k}" ${R.fb?"disabled":""}>${esc(ex.bank[bi])}</button>`).join("")}</div>
   <div class="bank">${ex.bank.map((w,i)=>`<button class="tile ${R.built.includes(i)?"used":""}" data-act="pick" data-i="${i}" ${R.fb?"disabled":""}>${esc(w)}</button>`).join("")}</div>`;
  foot=`<button class="btn wide" data-act="check" ${R.built.length?"":"disabled"}>Check</button>`}
 else if(ex.type==="match"){const m=R.m;
  body=`<div class="kind">Match</div><div class="prompt">Tap the pairs</div><div class="match">
   <div class="col">${ex.L.map((o,i)=>`<button class="mt ${m.selL===i?"sel":""} ${m.solved.includes(o.k)?"solved":""} ${m.wrong&&m.wrong[0]===i?"wrong":""}" data-act="ml" data-i="${i}" ${m.solved.includes(o.k)?"disabled":""}>${esc(T(o))}</button>`).join("")}</div>
   <div class="col">${ex.Rr.map((o,i)=>`<button class="mt ${m.selR===i?"sel":""} ${m.solved.includes(o.k)?"solved":""} ${m.wrong&&m.wrong[1]===i?"wrong":""}" data-act="mr" data-i="${i}" ${m.solved.includes(o.k)?"disabled":""}>${picHTML(o.pic,"op")}<span>${esc(TE(o))}</span></button>`).join("")}</div></div>`;
  foot=`<button class="btn wide" disabled>Match all ${ex.its.length} pairs</button>`}
 else if(ex.type==="speak"){
  body=`<div class="kind">Speaking</div><div class="card">${picHTML(it.pic)}<div class="fr">${esc(T(it))}</div><div class="pron">${esc(it.pron)}</div><div class="en">${esc(TE(it))}</div>${audioBtns()}</div>${speakBlock(true)}`;
  foot=`<button class="btn wide" disabled>Say it to continue</button>`}
 let fcls="";
 if(R.fb){fcls=R.fb.ok?"ok":"no";
  const okT=["Très bien !","Parfait !","Bravo !","Super !","Excellent !"][Math.random()*5|0];
  foot=`<div class="fb-t">${R.fb.ok?(R.fb.label||okT):"Pas tout à fait"}</div>
   ${ex.type==="match"?"":`<div class="fb-a"><button class="mini" data-act="play">${I.spk(14)} Play</button><span><b>${esc(T(it))}</b> · ${esc(TE(it))}</span></div>`}
   <button class="btn wide" data-act="next">Continue</button>`}
 app.innerHTML=`<div class="lesson">${head}<div class="l-body">${body}</div><div class="l-foot ${fcls}"><div class="l-foot-in">${foot}</div></div></div>`}
function markWeak(it,miss){const p=P();if(miss)p.weak[it.k]=(p.weak[it.k]||0)+1;else if(p.weak[it.k])p.weak[it.k]=Math.max(0,p.weak[it.k]-1)}
function check(){
 const ex=cur();let ok;
 if(ex.type==="build"||ex.type==="lbuild")ok=R.built.map(i=>ex.bank[i]).join(" ").toLowerCase()===ex.words.join(" ").toLowerCase();
 else ok=ex.opts[R.sel]===ex.item;
 if(ok){R.xp+=ex.retry?5:10;ding()}
 else{buzz();R.hearts--;R.mistakes++;const pool=R.L?R.L.pool:practicePool(P(),"mix");const again=mk(ex.type,ex.item,pool);again.retry=true;R.queue.push(again)}
 if(R.mode)markWeak(ex.item,!ok);else if(!ok)markWeak(ex.item,true);
 R.fb={ok};say(T(ex.item));renderLesson()}
async function doMic(){
 if(R.sp.state==="listening")return;R.sp.state="listening";R.sp.err="";renderLesson();
 const ex=cur(),it=ex.item,gated=ex.type==="speak";
 try{const alts=await listen();R.sp.tries++;
  const res=scoreSpeech(T(it),alts,it.fr.includes("{name}")?nm():"");const v=verdict(res.score);
  R.sp.state="result";R.sp.res=res;const p=P();
  p.best[it.k]=Math.max(p.best[it.k]||0,res.score);p.micBest=Math.max(p.micBest||0,res.score);
  if(v.pass){p.spoken++;R.spoke++;if(p.weak[it.k])p.weak[it.k]=Math.max(0,p.weak[it.k]-1)}else p.weak[it.k]=(p.weak[it.k]||0)+1;
  save();
  if(v.pass){ding();if(gated&&!R.fb){R.xp+=res.score>=85?15:10;R.fb={ok:true,label:v.label}}}else buzz();
 }catch(e){R.sp.state="idle";
  if(e==="not-allowed"||e==="service-not-allowed"){micBlocked=true}
  else R.sp.err=e==="no-speech"?"I didn't hear anything. Tap the mic and speak a little louder.":e==="network"?"The speech check needs an internet connection.":e==="audio-capture"?"No microphone found on this device.":e==="aborted"?"":"Something went wrong. Tap the mic to try again."}
 renderLesson()}
function next(){
 const ex=cur();if(ex&&ex.type==="speak"&&!R.fb)return;
 R.queue.shift();R.done++;
 if(R.hearts<=0)return failScreen();
 if(!R.queue.length)return finish();step()}
function awardDay(p,gained){const d=day();
 if(p.lastDay!==d){p.streak=p.lastDay===yday()?p.streak+1:1;p.lastDay=d}
 p.log[d]=(p.log[d]||0)+gained;p.xp+=gained}
function finish(){
 const p=P(),st=R.mistakes===0?3:R.mistakes<=2?2:1;
 const before=todayXP(p);
 const bonus=R.mode?0:20+(st===3?10:0),gained=R.xp+bonus;
 awardDay(p,gained);
 if(!R.mode){p.done[R.L.id]=Math.max(p.done[R.L.id]||0,st);if(st===3)p.perfect++}
 const fresh=BADGES.filter(b=>!p.badges.includes(b[0])&&b[4](p));fresh.forEach(b=>p.badges.push(b[0]));
 save();fanfare();confetti();
 const goalHit=before<p.goal&&todayXP(p)>=p.goal;
 const unitFinished=!R.mode&&R.L.l===2;
 app.innerHTML=`<div class="lesson"><div class="l-body end">${GASTON}
  <div class="kind">${R.mode?"Practice done":unitFinished?`Unit ${R.L.u+1} complete`:`Station ${R.L.id+1} complete`}</div>
  <div class="big">${st===3?"Parfait !":"Bravo, "+esc(p.name)+" !"}</div>
  <div class="stars">${stars(st)}</div>
  <div class="stats"><div class="stat"><b>+${gained}</b><small>XP</small></div><div class="stat"><b>${liveStreak(p)}</b><small>Day streak</small></div><div class="stat"><b>${R.mistakes}</b><small>Mistakes</small></div></div>
  ${goalHit?`<div class="note"><b>Daily goal reached!</b> À demain !</div>`:""}
  ${fresh.length?`<div class="kind">New passport stamp${fresh.length>1?"s":""}</div><div class="stamps" style="width:100%">${fresh.map(b=>`<div class="stamp"><span class="sm">${b[3]}</span><b>${b[1]}</b><small>${b[2]}</small></div>`).join("")}</div>`:""}
 </div><div class="l-foot"><div class="l-foot-in">${!R.mode&&curIdx(p)<NST?`<button class="btn wide" data-act="start" data-id="${curIdx(p)}">Next station</button><button class="btn ghost wide" data-act="home">Back to map</button>`:`<button class="btn wide" data-act="home">Back to map</button>`}</div></div></div>`;
 R=null}
function failScreen(){const id=R.L?R.L.id:null,mode=R.mode;R=null;
 app.innerHTML=`<div class="lesson"><div class="l-body end">${GASTON}<div class="big">Out of hearts</div><p style="color:var(--muted);max-width:32ch">That's OK. Mistakes help words stick. Try again; it gets easier every time.</p></div>
 <div class="l-foot"><div class="l-foot-in"><button class="btn wide" data-act="${mode?"practice":"start"}" ${mode?`data-m="${mode}"`:`data-id="${id}"`}>Try again</button><button class="btn ghost wide" data-act="home">Back to map</button></div></div></div>`}

/* ============ EVENTS ============ */
document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act,p=P();
 // shell
 if(a==="tab"){TAB=b.dataset.t;UI.confirm=null;UI.msg="";render._scrolled=TAB!=="learn";window.scrollTo(0,0);return render()}
 if(a==="start"){const id=+b.dataset.id;if(p&&id>curIdx(p)){b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");buzz();return}return start(id)}
 if(a==="practice")return start(0,b.dataset.m);
 if(a==="home"||a==="quit"){if(hasTTS)speechSynthesis.cancel();if(recog)try{recog.abort()}catch(x){}R=null;render._scrolled=0;TAB="learn";return render()}
 if(a==="install"&&installEvt){installEvt.prompt();try{await installEvt.userChoice}catch(x){}installEvt=null;return render()}
 if(a==="say"){const it=ALL.find(x=>x.k===b.dataset.k);if(it)say(T(it));return}
 // profile form
 if(a==="ava"){UI.form.avatar=b.dataset.a;return render()}
 if(a==="fkid"){UI.form.kid=!UI.form.kid;return render()}
 if(a==="saveform"){const f=UI.form,name=(f.name||"").trim();if(!name){const i=document.getElementById("pname");i.focus();i.placeholder="Please type a name";return}
  if(f.mode==="edit"){p.name=name;p.avatar=f.avatar}else{const np=newProfile(name,f.avatar,f.kid);ST.profiles.push(np);ST.active=np.id}
  UI.form=null;save();TAB=f.mode==="edit"?"me":"learn";render._scrolled=0;return render()}
 if(a==="cancelform"){UI.form=null;return render()}
 if(a==="newp"){UI.form={name:"",avatar:AVATARS[ST.profiles.length%AVATARS.length],kid:false,mode:"new"};return render()}
 if(a==="editp"){UI.form={name:p.name,avatar:p.avatar,kid:p.kid,mode:"edit"};return render()}
 if(a==="switch"){ST.active=b.dataset.id;save();UI.confirm=null;return render()}
 if(a==="kid"){p.kid=!p.kid;save();return render()}
 if(a==="goal"){p.goal=+b.dataset.g;save();return render()}
 if(a==="sound"){ST.sound=!ST.sound;save();return render()}
 if(a==="reset"||a==="del"){UI.confirm=a;return render()}
 if(a==="cancel"){UI.confirm=null;return render()}
 if(a==="reset-yes"){const np=newProfile(p.name,p.avatar,p.kid);np.id=p.id;np.goal=p.goal;ST.profiles[ST.profiles.indexOf(p)]=np;UI.confirm=null;save();return render()}
 if(a==="del-yes"){ST.profiles=ST.profiles.filter(q=>q.id!==p.id);ST.active=ST.profiles[0].id;UI.confirm=null;save();return render()}
 if(a==="backup"){const code=btoa(unescape(encodeURIComponent(JSON.stringify(ST))));
  try{await navigator.clipboard.writeText(code);UI.msg="Backup code copied. Paste it somewhere safe, or into Restore on your other device."}
  catch(x){UI.restore=code;UI.msg="Copy the code from the box above."}return render()}
 if(a==="restore-open"){UI.restore=UI.restore===""?"open":"";UI.msg="";return render()}
 if(a==="restore"){const v=(document.getElementById("restore").value||"").trim();
  try{const s=JSON.parse(decodeURIComponent(escape(atob(v))));if(!s||s.v!==2||!Array.isArray(s.profiles))throw 0;ST=s;save();UI.restore="";UI.msg="Progress restored."}
  catch(x){UI.msg="That code didn't work. Check you copied all of it."}return render()}
 // lesson
 if(!R)return;const ex=cur();
 if(a==="play")return say(T(ex.item));
 if(a==="slow")return say(T(ex.item),true);
 if(a==="next")return next();
 if(a==="sel"){R.sel=+b.dataset.i;if(ex.type!=="listen")say(T(ex.opts[R.sel]));return renderLesson()}
 if(a==="pick"){R.built.push(+b.dataset.i);return renderLesson()}
 if(a==="unpick"){R.built.splice(+b.dataset.k,1);return renderLesson()}
 if(a==="check")return check();
 if(a==="mic")return doMic();
 if(a==="stopmic"){if(recog)try{recog.stop()}catch(x){}return}
 if(a==="selfok"){P().spoken++;R.spoke++;R.xp+=10;R.fb={ok:true,label:"Bien joué !"};ding();save();return renderLesson()}
 if(a==="skipspeak"){R.xp+=3;R.fb={ok:true,label:"Keep practising!"};return renderLesson()}
 if(a==="ml"||a==="mr"){const m=R.m;m.wrong=null;
  if(a==="ml"){m.selL=+b.dataset.i;say(T(ex.L[m.selL]))}else m.selR=+b.dataset.i;
  if(m.selL!=null&&m.selR!=null){const l=ex.L[m.selL],r=ex.Rr[m.selR];
   if(l===r){m.solved.push(l.k);ding()}else{m.wrong=[m.selL,m.selR];buzz();R.mistakes++;R.hearts--;markWeak(l,true)}
   m.selL=m.selR=null;
   if(m.solved.length===ex.its.length){R.xp+=10;R.fb={ok:true,label:"Toutes les paires !"}}
   else if(R.hearts<=0){R.fb={ok:false}}}
  return renderLesson()}
});
render();initCloud();
try{if("serviceWorker" in navigator&&location.protocol==="https:"&&!inClaude&&document.querySelector('link[rel="manifest"]'))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
